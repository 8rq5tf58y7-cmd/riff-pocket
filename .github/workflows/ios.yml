name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      testflight:
        description: "Also upload to TestFlight (needs App Store Connect secrets)"
        type: boolean
        default: false

jobs:
  core-tests:
    name: RiffCore tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path Packages/RiffCore

  desktop-tests:
    name: Riff Desk tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
        working-directory: desktop

  desktop-windows:
    name: Riff Desk for Windows (.exe)
    runs-on: windows-latest
    needs: desktop-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build RiffDesk.exe (Python bundled, nothing to install)
        working-directory: desktop
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pyinstaller==6.16.0
          pyinstaller --noconfirm --onefile --name RiffDesk --add-data "riffdesk/web;riffdesk/web" riffdesk.py
      - name: Smoke test — start it and load the web app
        working-directory: desktop
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\RiffDesk.exe -ArgumentList "--no-browser","--port","8799","--host","127.0.0.1","--data","$env:RUNNER_TEMP\riffdesk" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 1
            try { $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8799/; if ($r.Content -match "Riff Desk") { $ok = $true; break } } catch {}
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { throw "RiffDesk.exe did not serve the web app" }
          "RiffDesk.exe started and served the web app."
      - uses: actions/upload-artifact@v4
        with:
          name: RiffDesk-windows
          path: desktop/dist/RiffDesk.exe
          retention-days: 30

  connector-tests:
    name: Claude connector tests (Worker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install, type-check, and run end-to-end against wrangler dev
        working-directory: connector
        run: |
          npm ci
          npx wrangler types
          npx tsc --noEmit
          printf 'OWNER_PASSWORD=%s\nSYNC_KEY=%s\n' "ci-password-$RANDOM$RANDOM" "ci-sync-key-$RANDOM$RANDOM$RANDOM$RANDOM" > .dev.vars
          npx wrangler d1 migrations apply DB --local
          npx wrangler dev --local-protocol https --port 8788 --ip 127.0.0.1 > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -skf https://127.0.0.1:8788/health && break; sleep 1; done
          set -a; . ./.dev.vars; set +a
          NODE_TLS_REJECT_UNAUTHORIZED=0 BASE=https://127.0.0.1:8788 node test/e2e.mjs || { cat wrangler.log; exit 1; }

  ios-build:
    name: Build iOS app
    runs-on: macos-26
    needs: core-tests
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: RiffCore tests (Apple platform)
        run: swift test --package-path Packages/RiffCore

      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild -project RiffPocket.xcodeproj -scheme RiffPocket \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -skipMacroValidation -skipPackagePluginValidation \
            build | xcbeautify

      - name: Package unsigned .ipa (install with SideStore)
        run: |
          set -euo pipefail
          APP=build/Build/Products/Release-iphoneos/RiffPocket.app
          test -f "$APP/RiffPocket" || { echo "::error::$APP has no executable — the build did not produce an app"; exit 1; }
          du -sh "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry RiffPocket-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: RiffPocket-unsigned-ipa
          path: RiffPocket-unsigned.ipa
          retention-days: 14

  testflight:
    name: TestFlight
    runs-on: macos-26
    needs: ios-build
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen && xcodegen generate
      - name: Archive, sign (cloud-managed) and upload
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KEY=~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$KEY"
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          xcodebuild -project RiffPocket.xcodeproj -scheme RiffPocket -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/RiffPocket.xcarchive \
            DEVELOPMENT_TEAM=$APPLE_TEAM_ID CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} -skipMacroValidation -skipPackagePluginValidation $AUTH archive
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/RiffPocket.xcarchive \
            -exportOptionsPlist ExportOptions.plist -exportPath build/export $AUTH
